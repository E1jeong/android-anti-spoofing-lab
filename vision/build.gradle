plugins {
    id 'com.android.library'
}

android {
    namespace 'com.unionbiometrics.vision'
    compileSdk 34
    buildToolsVersion '35.0.1'

    defaultConfig {
        minSdk 30
        versionCode 1
        versionName '0.1.0'
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    androidResources {
        noCompress 'tflite'
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    compileOnly 'androidx.annotation:annotation:1.9.1'
    implementation 'org.tensorflow:tensorflow-lite:2.16.1'
    testImplementation 'androidx.annotation:annotation:1.9.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20180130'
}

def visionAssetDir = file('src/main/assets/ubio-vision')
tasks.register('verifyVisionAssets') {
    doLast {
        def manifestFile = new File(visionAssetDir, 'model_manifest.json')
        if (!manifestFile.exists()) {
            throw new GradleException('Missing ' + manifestFile + '. Vision slots cannot load.')
        }
        def json = new groovy.json.JsonSlurper().parseText(manifestFile.getText('UTF-8'))
        def models = json.models
        if (!(models instanceof List) || models.isEmpty()) {
            throw new GradleException(manifestFile.name + ' has no models')
        }
        def supportedTypes = ['single_1_input', 'dual_2_input'] as Set
        def expectedClassOrder = ['live', 'print', 'picture', 'mask', 'display', 'pmask',
                                  'curved_print', 'curved_mask', 'curved_picture', 'curved_pmask',
                                  'dental_white', 'dental_black']
        models.each { model ->
            def type = model.type
            if (!(type instanceof String) || !supportedTypes.contains(type)) {
                throw new GradleException('Unsupported Vision model type: ' + type)
            }
            ['model', 'spec'].each { key ->
                def name = model[key]
                if (!(name instanceof String) || name.isEmpty()) {
                    throw new GradleException('Vision manifest entry is missing ' + key + ': ' + model)
                }
                def asset = new File(visionAssetDir, name)
                if (!asset.exists()) {
                    throw new GradleException('Vision manifest references missing asset: ' + asset)
                }
            }
            def specFile = new File(visionAssetDir, model.spec as String)
            def spec = new groovy.json.JsonSlurper().parseText(specFile.getText('UTF-8'))
            def classOrder = spec.class_order
            if (!(classOrder instanceof List) || classOrder.size() != expectedClassOrder.size()
                    || !(0..<classOrder.size()).every { i -> classOrder[i] instanceof String
                    && classOrder[i].equalsIgnoreCase(expectedClassOrder[i]) }) {
                throw new GradleException('Vision sidecar class_order does not match expected labels: ' + model.spec)
            }
            def inputs = spec.inputs
            if (!(inputs instanceof List)) {
                throw new GradleException('Vision sidecar must contain generated inputs: ' + model.spec)
            }
            def inputKinds = inputs.collect { it.input_kind }
            def inputIndices = inputs.collect { it.index }
            def validSingle = type == 'single_1_input'
                    && inputKinds == ['ir'] && inputIndices == [0]
            def validDual = type == 'dual_2_input'
                    && inputs.size() == 2
                    && inputKinds.toSet() == ['rgb', 'ir'] as Set
                    && inputIndices.toSet() == [0, 1] as Set
            if (!validSingle && !validDual) {
                throw new GradleException('Vision sidecar inputs do not match ' + type + ': ' + model.spec)
            }
        }
    }
}
afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'verifyVisionAssets' }
}
